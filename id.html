<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face ID - AI Vision Security</title>
  
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
    
    body, html {
      width: 100%; height: 100%;
      background-color: #030712;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .camera-container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    /* Hiệu ứng khung viền HUD công nghệ cao 4 góc */
    .hud-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.6);
    }
    
    .hud-overlay::before, .hud-overlay::after {
      content: ''; position: absolute; width: 40px; height: 40px; border-color: rgba(99, 102, 241, 0.6); border-style: solid; transition: all 0.3s;
    }
    .hud-overlay::before { top: 20px; left: 20px; border-width: 3px 0 0 3px; }
    .hud-overlay::after { top: 20px; right: 20px; border-width: 3px 3px 0 0; }

    .hud-bottom-corners::before, .hud-bottom-corners::after {
      content: ''; position: absolute; width: 40px; height: 40px; border-color: rgba(99, 102, 241, 0.6); border-style: solid;
    }
    .hud-bottom-corners::before { bottom: 20px; left: 20px; border-width: 0 0 3px 3px; }
    .hud-bottom-corners::after { bottom: 20px; right: 20px; border-width: 0 3px 3px 0; }

    /* Thanh trạng thái tối giản siêu đẹp ở góc dưới */
    .status-pill {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75);
      color: #E2E8F0;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      z-index: 10;
      transition: opacity 0.5s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px; height: 8px; background-color: #F59E0B; border-radius: 50%;
      box-shadow: 0 0 8px #F59E0B; animation: pulseDot 1.5s infinite;
    }
    .dot.ready { background-color: #10B981; box-shadow: 0 0 10px #10B981; }

    @keyframes pulseDot {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>

  <div class="camera-container" id="container">
    <video id="video" autoplay muted playsinline></video>
    
    <!-- Khung trang trí HUD Công nghệ -->
    <div class="hud-overlay">
      <div class="hud-bottom-corners"></div>
    </div>

    <!-- Thanh trạng thái -->
    <div id="status" class="status-pill">
      <div id="dot" class="dot"></div>
      <span id="status-text">Đang khởi tạo hệ thống AI...</span>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLFwJo3omYl1N7nyqCD5Lq7GJzGc4dCWrpUYWg7IgGiu6e-Budpn4aGrySBEvvPcCI/exec"; 
    
    let faceMatcher = null; 
    let isDetecting = false;
    let canvas = null;

    const video = document.getElementById('video');
    const container = document.getElementById('container');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('dot');
    const statusBox = document.getElementById('status');

    // 1. Tải mô hình AI
    async function loadModels() {
      const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
      try {
        statusText.innerText = "Đang tải mô hình trí tuệ nhân tạo...";
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        
        startCamera();
      } catch (e) {
        statusText.innerText = "Lỗi tải mô hình AI!";
      }
    }

    // 2. Khởi động Camera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" } 
        });
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
          video.play();
          
          canvas = faceapi.createCanvasFromMedia(video);
          container.append(canvas);
          
          const displaySize = { width: video.videoWidth, height: video.videoHeight };
          faceapi.matchDimensions(canvas, displaySize);

          loadDataFromAppsScript();
        };
      } catch (err) {
        statusText.innerText = "Không thể bật Camera!";
      }
    }

    // 3. Tải cơ sở dữ liệu từ Google Sheets
    async function loadDataFromAppsScript() {
      try {
        statusText.innerText = "Đang đồng bộ dữ liệu nhân sự...";
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();
        
        if (result.status === "success") {
          const labeledFaceDescriptors = [];
          
          for (let i = 0; i < result.data.length; i++) {
            const row = result.data[i];
            const empId = row[0];
            const empName = row[1];
            const rawFaceData = row[2];
            
            if (!empId || !rawFaceData) continue;
            
            try {
              const parsedArray = typeof rawFaceData === 'string' ? JSON.parse(rawFaceData) : rawFaceData;
              if (Array.isArray(parsedArray) && parsedArray.length > 0) {
                const descriptor = new Float32Array(parsedArray);
                labeledFaceDescriptors.push(
                  new faceapi.LabeledFaceDescriptors(`${empId} - ${empName}`, [descriptor])
                );
              }
            } catch (err) {
              console.error("Lỗi parse dữ liệu:", err);
            }
          }

          if (labeledFaceDescriptors.length > 0) {
            faceMatcher = new faceapi.FaceMatcher(labeledFaceDescriptors, 0.60);
            statusText.innerText = `Hệ thống sẵn sàng (${labeledFaceDescriptors.length} nhân sự)`;
            statusDot.classList.add('ready');
            
            // Tự động ẩn thanh trạng thái sau 3.5 giây để màn hình hoàn toàn trong suốt, chỉ giữ lại camera & khung quét
            setTimeout(() => { 
              statusBox.style.opacity = '0';
              setTimeout(() => statusBox.style.display = 'none', 500);
            }, 3500);

            startRecognitionLoop();
          } else {
            statusText.innerText = "Chưa có dữ liệu nhân sự trên Google Sheets!";
          }
        }
      } catch (error) {
        statusText.innerText = "Lỗi kết nối máy chủ!";
      }
    }

    // 4. Vòng lặp nhận diện khuôn mặt
    function startRecognitionLoop() {
      setInterval(async () => {
        if (!faceMatcher || isDetecting || video.paused || video.ended) return;
        
        isDetecting = true;

        try {
          const detection = await faceapi.detectSingleFace(video)
            .withFaceLandmarks()
            .withFaceDescriptor();

          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (detection) {
            const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
            const box = detection.detection.box;

            // Tùy chỉnh màu sắc khung nổi (Xanh ngọc sang trọng cho nhân viên, Đỏ cảnh báo cho người lạ)
            const isStranger = bestMatch.label === "unknown";
            const boxColor = isStranger ? "#EF4444" : "#10B981";
            const labelText = isStranger ? "⚠️️ Người Lạ" : `✅ ${bestMatch.label}`;

            const drawBox = new faceapi.draw.DrawBox(box, {
              label: labelText,
              boxColor: boxColor,
              drawLabelOptions: {
                backgroundColor: isStranger ? 'rgba(239, 68, 68, 0.85)' : 'rgba(16, 185, 129, 0.85)',
                fontColor: '#FFFFFF',
                fontSize: 16,
                padding: 8
              }
            });
            drawBox.draw(canvas);
          }
        } catch (err) {
          console.error("Lỗi quét:", err);
        }

        isDetecting = false;
      }, 500); // Tốc độ quét cực mượt 0.5 giây / lần
    }

    window.onload = loadModels;
  </script>
</body>
</html>
