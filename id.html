<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face ID - Camera Tràn Màn Hình</title>
  
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* Thiết lập màn hình nền đen tuyệt đối, căn giữa camera */
    body, html {
      width: 100%; height: 100%;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Container chứa camera chiếm toàn bộ không gian */
    .camera-fullscreen {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Lấp đầy toàn màn hình mà không méo ảnh */
      display: block;
      transform: scaleX(-1); /* Lật gương camera trước */
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    /* Dòng trạng thái nhỏ gọn chìm ở góc dưới (có thể ẩn đi nếu không muốn thấy chữ) */
    .status-floating {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 0.85rem;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="camera-fullscreen" id="container">
    <video id="video" autoplay muted playsinline></video>
    <div id="status" class="status-floating">Đang tải mô hình AI...</div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLFwJo3omYl1N7nyqCD5Lq7GJzGc4dCWrpUYWg7IgGiu6e-Budpn4aGrySBEvvPcCI/exec"; 
    
    let faceMatcher = null; 
    let isDetecting = false;
    let canvas = null;

    const video = document.getElementById('video');
    const container = document.getElementById('container');
    const statusText = document.getElementById('status');

    // 1. Tải mô hình AI từ CDN
    async function loadModels() {
      const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
      try {
        statusText.innerText = "Đang tải AI...";
        await faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        
        startCamera();
      } catch (e) {
        statusText.innerText = "Lỗi tải AI!";
      }
    }

    // 2. Mở Camera toàn màn hình & tạo Canvas đè lên
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" } 
        });
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
          video.play();
          
          canvas = faceapi.createCanvasFromMedia(video);
          container.append(canvas);
          
          const displaySize = { width: video.videoWidth, height: video.videoHeight };
          faceapi.matchDimensions(canvas, displaySize);

          loadDataFromAppsScript();
        };
      } catch (err) {
        statusText.innerText = "Không thể mở Camera!";
      }
    }

    // 3. Tải cơ sở dữ liệu khuôn mặt từ Google Sheets
    async function loadDataFromAppsScript() {
      try {
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();
        
        if (result.status === "success") {
          const labeledFaceDescriptors = [];
          
          for (let i = 0; i < result.data.length; i++) {
            const row = result.data[i];
            const empId = row[0];
            const empName = row[1];
            const rawFaceData = row[2];
            
            if (!empId || !rawFaceData) continue;
            
            try {
              const parsedArray = typeof rawFaceData === 'string' ? JSON.parse(rawFaceData) : rawFaceData;
              if (Array.isArray(parsedArray) && parsedArray.length > 0) {
                const descriptor = new Float32Array(parsedArray);
                labeledFaceDescriptors.push(
                  new faceapi.LabeledFaceDescriptors(`${empId} - ${empName}`, [descriptor])
                );
              }
            } catch (err) {
              console.error("Lỗi parse dòng:", err);
            }
          }

          if (labeledFaceDescriptors.length > 0) {
            faceMatcher = new faceapi.FaceMatcher(labeledFaceDescriptors, 0.60);
            statusText.innerText = `Đang quét (${labeledFaceDescriptors.length} NV)`;
            
            // Tự động ẩn dòng trạng thái sau 3 giây để màn hình hoàn toàn trống, chỉ còn camera
            setTimeout(() => { statusText.style.display = 'none'; }, 3000);

            startRecognitionLoop();
          } else {
            statusText.innerText = "Chưa có dữ liệu nhân sự trên Sheets";
          }
        }
      } catch (error) {
        statusText.innerText = "Lỗi kết nối máy chủ!";
      }
    }

    // 4. Vòng lặp nhận diện & vẽ khung tên nổi trực tiếp lên mặt
    function startRecognitionLoop() {
      setInterval(async () => {
        if (!faceMatcher || isDetecting || video.paused || video.ended) return;
        
        isDetecting = true;

        try {
          const detection = await faceapi.detectSingleFace(video)
            .withFaceLandmarks()
            .withFaceDescriptor();

          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (detection) {
            const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
            const box = detection.detection.box;

            // Vẽ khung viền và tên trực tiếp lên khuôn mặt
            const drawBox = new faceapi.draw.DrawBox(box, {
              label: bestMatch.label === "unknown" ? "Người lạ" : bestMatch.label,
              boxColor: bestMatch.label === "unknown" ? "#EF4444" : "#10B981"
            });
            drawBox.draw(canvas);
          }
        } catch (err) {
          console.error("Lỗi nhận diện:", err);
        }

        isDetecting = false;
      }, 600);
    }

    window.onload = loadModels;
  </script>
</body>
</html>
