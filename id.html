<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face ID - Nhận Diện Siêu Mượt</title>
  
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    
    body, html {
      width: 100%; height: 100%;
      background-color: #F1F5F9;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .app-card {
      background: #FFFFFF;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid #E2E8F0;
    }

    .camera-container {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    .info-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s ease;
    }

    .info-icon { font-size: 1.5rem; display: flex; align-items: center; justify-content: center; }
    .info-content { display: flex; flex-direction: column; gap: 2px; }
    .info-title { font-size: 0.75rem; text-transform: uppercase; color: #64748B; font-weight: 600; }
    .info-text { font-size: 0.95rem; font-weight: 700; color: #1E293B; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="camera-container" id="container">
      <video id="video" autoplay muted playsinline></video>
    </div>

    <div id="info-box" class="info-box">
      <div id="info-icon" class="info-icon">⏳</div>
      <div class="info-content">
        <span class="info-title">Trạng thái nhận diện</span>
        <span id="info-text" class="info-text">Đang khởi động hệ thống AI...</span>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLFwJo3omYl1N7nyqCD5Lq7GJzGc4dCWrpUYWg7IgGiu6e-Budpn4aGrySBEvvPcCI/exec"; 
    
    let faceMatcher = null; 
    let canvas = null;
    let displaySize = null;

    const video = document.getElementById('video');
    const container = document.getElementById('container');
    const infoBox = document.getElementById('info-box');
    const infoIcon = document.getElementById('info-icon');
    const infoText = document.getElementById('info-text');

    function updateStatus(icon, text, borderColor, bgColor) {
      infoIcon.innerText = icon;
      infoText.innerText = text;
      infoBox.style.borderColor = borderColor;
      infoBox.style.backgroundColor = bgColor;
    }

    // 1. Tải mô hình AI siêu nhẹ (TinyFaceDetector) giúp camera không giật
    async function loadModels() {
      const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
      try {
        updateStatus("⏳", "Đang tải mô hình AI tối ưu...", "#E2E8F0", "#F8FAFC");
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        
        startCamera();
      } catch (e) {
        updateStatus("❌", "Lỗi tải mô hình AI từ mạng!", "#EF4444", "#FEF2F2");
      }
    }

    // 2. Khởi động Camera mượt mà
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: "user" } 
        });
        video.srcObject = stream;
        
        video.onloadedmetadata = () => {
          video.play();
          
          canvas = faceapi.createCanvasFromMedia(video);
          container.append(canvas);
          
          displaySize = { width: video.videoWidth, height: video.videoHeight };
          faceapi.matchDimensions(canvas, displaySize);

          loadDataFromAppsScript();
        };
      } catch (err) {
        updateStatus("📷", "Không thể truy cập Camera!", "#EF4444", "#FEF2F2");
      }
    }

    // 3. Tải dữ liệu nhân sự từ Google Sheets
    async function loadDataFromAppsScript() {
      try {
        updateStatus("🔄", "Đang đồng bộ dữ liệu nhân sự...", "#CBD5E1", "#F8FAFC");
        const response = await fetch(SCRIPT_URL);
        const result = await response.json();
        
        if (result.status === "success") {
          const labeledFaceDescriptors = [];
          
          for (let i = 0; i < result.data.length; i++) {
            const row = result.data[i];
            const empId = row[0];
            const empName = row[1];
            const rawFaceData = row[2];
            
            if (!empId || !rawFaceData) continue;
            
            try {
              const parsedArray = typeof rawFaceData === 'string' ? JSON.parse(rawFaceData) : rawFaceData;
              if (Array.isArray(parsedArray) && parsedArray.length > 0) {
                const descriptor = new Float32Array(parsedArray);
                labeledFaceDescriptors.push(
                  new faceapi.LabeledFaceDescriptors(`${empId} - ${empName}`, [descriptor])
                );
              }
            } catch (err) {
              console.error("Lỗi parse dữ liệu:", err);
            }
          }

          if (labeledFaceDescriptors.length > 0) {
            faceMatcher = new faceapi.FaceMatcher(labeledFaceDescriptors, 0.60);
            updateStatus("👀", `Đang quét tìm khuôn mặt (${labeledFaceDescriptors.length} NV)...`, "#CBD5E1", "#F8FAFC");
            
            // Kích hoạt vòng lặp không giật
            startSmoothRecognition();
          } else {
            updateStatus("⚠️", "Chưa có dữ liệu nhân sự trên Sheets!", "#F59E0B", "#FEF3C7");
          }
        }
      } catch (error) {
        updateStatus("🔌", "Lỗi kết nối máy chủ Apps Script!", "#EF4444", "#FEF2F2");
      }
    }

    // 4. Vòng lặp nhận diện sử dụng TinyFaceDetector tối ưu hóa tuyệt đối chống giật lag
    async function startSmoothRecognition() {
      const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
      const ctx = canvas.getContext('2d');

      const detectFrame = async () => {
        if (video.paused || video.ended || !faceMatcher) return;

        try {
          const detection = await faceapi.detectSingleFace(video, options)
            .withFaceLandmarks()
            .withFaceDescriptor();

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          if (!detection) {
            updateStatus("👀", "Đang tìm kiếm khuôn mặt trước ống kính...", "#CBD5E1", "#F8FAFC");
          } else {
            const resizedDetection = faceapi.resizeResults(detection, displaySize);
            const bestMatch = faceMatcher.findBestMatch(resizedDetection.descriptor);
            const box = resizedDetection.detection.box;

            const isStranger = bestMatch.label === "unknown";
            const boxColor = isStranger ? "#EF4444" : "#10B981";
            const labelText = isStranger ? "Người lạ" : bestMatch.label;

            // Vẽ khung trực tiếp cực kỳ mượt
            const drawBox = new faceapi.draw.DrawBox(box, {
              label: labelText,
              boxColor: boxColor,
              drawLabelOptions: {
                backgroundColor: boxColor,
                fontColor: '#FFFFFF',
                fontSize: 14,
                padding: 6
              }
            });
            drawBox.draw(canvas);

            if (isStranger) {
              updateStatus("🚫", "Phát hiện: Người lạ (Chưa đăng ký)", "#EF4444", "#FEF2F2");
            } else {
              updateStatus("✅", `Xin chào: ${bestMatch.label}`, "#10B981", "#ECFDF5");
            }
          }
        } catch (err) {
          console.error("Lỗi khung hình:", err);
        }

        // Dùng requestAnimationFrame thay vì setInterval giúp camera chạy 60 FPS mượt mà không bị nghẽn
        requestAnimationFrame(detectFrame);
      };

      detectFrame();
    }

    window.onload = loadModels;
  </script>
</body>
</html>
