<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CCCD AI Scanner</title>
    <!-- Tải thư viện AI OpenCV.js -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady();"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { 
            background: linear-gradient(135deg, #0f172a, #1e293b, #334155); 
            color: #f8fafc; min-height: 100vh; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
            padding: 24px; width: 100%; max-width: 500px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); text-align: center;
        }
        
        #camera-container {
            position: relative; width: 100%; margin: 0 auto 20px auto; 
            overflow: hidden; border-radius: 16px; display: none; background: #000;
        }
        #video { width: 100%; display: block; object-fit: cover; }
        
        .guide-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; aspect-ratio: 85.6 / 53.98;
            border: 2px dashed rgba(56, 189, 248, 0.5); border-radius: 14px;
            pointer-events: none;
        }

        .action-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 15px; }
        
        button {
            width: 100%; padding: 16px; border-radius: 12px; font-weight: bold; font-size: 15px;
            border: none; cursor: pointer; transition: 0.2s;
        }
        button:disabled { background: #64748b !important; color: #cbd5e1 !important; cursor: not-allowed; box-shadow: none !important;}
        button:hover:not(:disabled) { transform: translateY(-2px); }
        
        .btn-primary { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3); }
        .btn-secondary { background: linear-gradient(135deg, #475569, #334155); color: #fff; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); border: 1px solid #64748b; }
        .btn-capture { background: linear-gradient(135deg, #059669, #10b981); color: #fff; display: none; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        
        .result-container { display: flex; justify-content: space-around; gap: 15px; margin-top: 20px; }
        .result-item { flex: 1; text-align: center; font-size: 13px; color: #94a3b8; font-weight: bold;}
        .result-item canvas { 
            width: 100%; max-width: 200px; margin-top: 10px;
            border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
        }
        #instruction { font-size: 17px; font-weight: 600; color: #fbbf24; margin-bottom: 20px; min-height: 25px;}
        #flashEffect { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; opacity: 0; pointer-events: none; transition: opacity 0.1s ease-out; z-index: 10; }
    </style>
</head>
<body>

    <div class="glass-panel">
        <h2 style="margin-top:0;">CCCD AI Scanner</h2>
        <div id="instruction">⏳ Đang tải thư viện AI...</div>
        
        <div class="action-group" id="startGroup">
            <button class="btn-primary" id="btnStartCamera" disabled>📸 Bật Camera</button>
            <button class="btn-secondary" id="btnUpload" disabled>📁 Chọn ảnh từ máy</button>
        </div>
        
        <!-- Input file ẩn để lấy ảnh từ thư viện -->
        <input type="file" id="fileInput" accept="image/*" style="display: none;">

        <div id="camera-container">
            <video id="video" autoplay playsinline></video>
            <div class="guide-overlay" id="guide"></div>
            <div id="flashEffect"></div>
        </div>

        <button class="btn-capture" id="btnMainAction">📸 CHỤP MẶT TRƯỚC</button>
        <div id="statusText" style="display:none; color:#34d399; margin-top:15px; font-weight:bold;">⏳ Đang xử lý...</div>

        <div class="result-container" id="results" style="display: none;">
            <div class="result-item">MẶT TRƯỚC<br><canvas id="canvasFront"></canvas></div>
            <div class="result-item">MẶT SAU<br><canvas id="canvasBack"></canvas></div>
        </div>
        
        <canvas id="hiddenCanvas" style="display:none;"></canvas>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw75f616BH-U49XkdmJ4OIyhcxaiC6L24VqcdxkQnY2ZE9VYOcfjN2Nams2jyIGGznoeg/exec"; 
        
        let cvReady = false;
        function onOpenCvReady() {
            cvReady = true;
            document.getElementById('instruction').innerHTML = "✅ AI đã sẵn sàng! Chọn phương thức:";
            document.getElementById('btnStartCamera').disabled = false;
            document.getElementById('btnUpload').disabled = false;
        }

        const video = document.getElementById('video');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const fileInput = document.getElementById('fileInput');
        let step = 1;
        let isUsingCamera = false;

        // 1. CHẾ ĐỘ MỞ CAMERA
        document.getElementById('btnStartCamera').addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
                video.srcObject = stream;
                isUsingCamera = true;
                
                document.getElementById('camera-container').style.display = 'block';
                document.getElementById('startGroup').style.display = 'none';
                document.getElementById('btnMainAction').style.display = 'block';
                document.getElementById('instruction').innerHTML = "Đưa <span style='color:#38bdf8'>MẶT TRƯỚC</span> vào camera";
            } catch (err) {
                alert("Lỗi Camera! Vui lòng cấp quyền.");
            }
        });

        // 2. CHẾ ĐỘ LẤY ẢNH TỪ MÁY
        document.getElementById('btnUpload').addEventListener('click', () => {
            fileInput.click(); // Mở hộp thoại chọn file
        });

        fileInput.addEventListener('change', function(e) {
            if(e.target.files.length === 0) return;
            const file = e.target.files[0];
            const reader = new FileReader();
            
            document.getElementById('instruction').innerHTML = "⏳ Đang phân tích ảnh...";
            document.getElementById('startGroup').style.display = 'none'; // Ẩn nút chọn
            
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Vẽ ảnh tải lên vào canvas ẩn
                    hiddenCanvas.width = img.width;
                    hiddenCanvas.height = img.height;
                    const hCtx = hiddenCanvas.getContext('2d');
                    hCtx.drawImage(img, 0, 0);

                    // Xử lý ảnh
                    if (step === 1) {
                        processImageSource('canvasFront', false);
                        document.getElementById('results').style.display = 'flex';
                        step = 2;
                        document.getElementById('instruction').innerHTML = "Tải lên <span style='color:#10b981'>MẶT SAU</span>";
                        
                        // Hiển thị lại nút tải ảnh nhưng đổi chữ
                        document.getElementById('startGroup').style.display = 'flex';
                        document.getElementById('btnStartCamera').style.display = 'none'; // Giấu nút camera đi
                        document.getElementById('btnUpload').innerHTML = "📁 CHỌN ẢNH MẶT SAU";
                        fileInput.value = ""; // Reset file input
                        
                    } else if (step === 2) {
                        processImageSource('canvasBack', false);
                        document.getElementById('startGroup').style.display = 'none';
                        document.getElementById('instruction').innerHTML = "🎉 Xử lý xong! Đang tải lên Drive...";
                        processAndUpload();
                    }
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        });

        // HÀM AI: TÌM 4 GÓC VÀ CẮT (Dùng chung cho cả Camera và Upload)
        function processImageSource(canvasOutId, fromLiveCamera) {
            if (fromLiveCamera) {
                hiddenCanvas.width = video.videoWidth;
                hiddenCanvas.height = video.videoHeight;
                hiddenCanvas.getContext('2d').drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
            }

            let src = cv.imread(hiddenCanvas);
            let gray = new cv.Mat();
            cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
            cv.GaussianBlur(gray, gray, new cv.Size(5, 5), 0, 0, cv.BORDER_DEFAULT);
            cv.Canny(gray, gray, 75, 200);

            let contours = new cv.MatVector();
            let hierarchy = new cv.Mat();
            cv.findContours(gray, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

            let maxArea = 0;
            let bestContour = null;

            for (let i = 0; i < contours.size(); ++i) {
                let cnt = contours.get(i);
                let area = cv.contourArea(cnt);
                // Lọc kích thước để tìm khung thẻ
                if (area > (src.cols * src.rows * 0.1)) { 
                    let peri = cv.arcLength(cnt, true);
                    let approx = new cv.Mat();
                    cv.approxPolyDP(cnt, approx, 0.02 * peri, true);
                    if (approx.rows === 4 && area > maxArea) {
                        maxArea = area;
                        bestContour = approx.clone();
                    }
                    approx.delete();
                }
            }

            const canvasOut = document.getElementById(canvasOutId);
            canvasOut.width = 856; canvasOut.height = 540; 
            const ctxOut = canvasOut.getContext('2d');

            if (bestContour) {
                // AI nắn thẳng thẻ nếu chụp bị nghiêng
                let pts = [];
                for(let i=0; i<4; i++) { pts.push({x: bestContour.data32S[i*2], y: bestContour.data32S[i*2+1]}); }
                pts.sort((a,b) => (a.x+a.y) - (b.x+b.y));
                let tl = pts[0], br = pts[3];
                let rem = [pts[1], pts[2]].sort((a,b) => (a.x-a.y) - (b.x-b.y));
                let bl = rem[0], tr = rem[1];

                let srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]);
                let dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, canvasOut.width, 0, canvasOut.width, canvasOut.height, 0, canvasOut.height]);

                let M = cv.getPerspectiveTransform(srcTri, dstTri);
                let warped = new cv.Mat();
                let dsize = new cv.Size(canvasOut.width, canvasOut.height);
                cv.warpPerspective(src, warped, M, dsize, cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());

                cv.imshow(canvasOutId, warped);
                srcTri.delete(); dstTri.delete(); M.delete(); warped.delete(); bestContour.delete();
            } else {
                // FALLBACK: Nếu AI không tìm được viền
                if (fromLiveCamera) {
                    const guideRect = document.getElementById('guide').getBoundingClientRect();
                    const videoRect = video.getBoundingClientRect();
                    const sX = video.videoWidth / videoRect.width, sY = video.videoHeight / videoRect.height;
                    const cX = (guideRect.left - videoRect.left)*sX, cY = (guideRect.top - videoRect.top)*sY;
                    ctxOut.drawImage(hiddenCanvas, cX, cY, guideRect.width*sX, guideRect.height*sY, 0, 0, canvasOut.width, canvasOut.height);
                } else {
                    // Nếu là ảnh upload mà không nhận diện được, lấy toàn bộ ảnh gốc ép vào khung thẻ
                    ctxOut.drawImage(hiddenCanvas, 0, 0, hiddenCanvas.width, hiddenCanvas.height, 0, 0, canvasOut.width, canvasOut.height);
                }
            }

            src.delete(); gray.delete(); contours.delete(); hierarchy.delete();
            applyRoundedCorners(canvasOut, ctxOut); // Luôn luôn bo tròn 4 góc
        }

        // HÀM BO GÓC TRÒN CCCD
        function applyRoundedCorners(canvas, ctx) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width; tempCanvas.height = canvas.height;
            tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const cr = 35; // Bán kính bo cong chuẩn thẻ
            ctx.beginPath();
            ctx.moveTo(cr, 0); ctx.lineTo(canvas.width - cr, 0); ctx.quadraticCurveTo(canvas.width, 0, canvas.width, cr);
            ctx.lineTo(canvas.width, canvas.height - cr); ctx.quadraticCurveTo(canvas.width, canvas.height, canvas.width - cr, canvas.height);
            ctx.lineTo(cr, canvas.height); ctx.quadraticCurveTo(0, canvas.height, 0, canvas.height - cr);
            ctx.lineTo(0, cr); ctx.quadraticCurveTo(0, 0, cr, 0); ctx.closePath();
            
            ctx.clip(); 
            ctx.drawImage(tempCanvas, 0, 0);
        }

        // XỬ LÝ NÚT CHỤP BẰNG CAMERA
        document.getElementById('btnMainAction').addEventListener('click', () => {
            const flashEff = document.getElementById('flashEffect');
            flashEff.style.opacity = '1';
            setTimeout(() => { flashEff.style.opacity = '0'; }, 150);

            if (step === 1) {
                processImageSource('canvasFront', true);
                document.getElementById('results').style.display = 'flex';
                step = 2;
                document.getElementById('guide').style.borderColor = "#10b981";
                document.getElementById('instruction').innerHTML = "Lật sang <span style='color:#10b981'>MẶT SAU</span>";
                document.getElementById('btnMainAction').innerHTML = "📸 CHỤP MẶT SAU";
            } else if (step === 2) {
                processImageSource('canvasBack', true);
                video.srcObject.getTracks().forEach(t => t.stop());
                document.getElementById('camera-container').style.display = 'none';
                document.getElementById('btnMainAction').style.display = 'none';
                document.getElementById('instruction').innerHTML = "🎉 Xử lý xong! Đang tải lên Drive...";
                processAndUpload();
            }
        });

        // HÀM GHÉP A4 & LƯU LÊN DRIVE / SHEET
        async function processAndUpload() {
            document.getElementById('statusText').style.display = 'block';
            const canvasA4 = document.createElement('canvas');
            canvasA4.width = 794; canvasA4.height = 1123;
            const ctx = canvasA4.getContext('2d');
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvasA4.width, canvasA4.height);

            const cF = document.getElementById('canvasFront');
            const cB = document.getElementById('canvasBack');
            const cW = 500, cH = cW / (85.6/53.98), xO = (794 - cW)/2;
            
            ctx.drawImage(cF, xO, 150, cW, cH);
            ctx.drawImage(cB, xO, 150 + cH + 50, cW, cH);

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ filename: "CCCD_" + new Date().getTime(), image: canvasA4.toDataURL("image/png") }),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const res = await response.json();
                document.getElementById('statusText').innerHTML = `✅ Thành công! Mã Hồ sơ: ${res.id} <br><br> <a href="${res.url}" target="_blank" style="color:#38bdf8; text-decoration:none; border:1px solid #38bdf8; padding:8px; border-radius:5px;">🔗 MỞ BẢN IN A4</a>`;
            } catch (e) {
                document.getElementById('statusText').innerHTML = "❌ Lỗi kết nối máy chủ!";
            }
        }
    </script>
</body>
</html>
