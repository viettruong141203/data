<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Face Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        :root {
            --primary: #00bfa5; /* Xanh ngọc */
            --bg-gradient: linear-gradient(135deg, #e4c1f9 0%, #a9def9 100%);
            --card-bg: #ffffff;
            --result-bg: #eaffea;
            --result-border: #b2ebb4;
            --text-dark: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Thẻ bao bọc ngoài cùng (Màu trắng) */
        .main-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Khu vực Camera */
        .scanner-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4; /* Tỷ lệ khung hình dọc */
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }

        video, canvas {
            transform: scaleX(-1);
            -webkit-transform: scaleX(-1);
        }

        video { width: 100%; height: 100%; object-fit: cover; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }

        /* Tia quét ngang màu xanh tím */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: rgba(100, 100, 255, 0.8);
            box-shadow: 0 0 20px rgba(100, 100, 255, 0.8);
            top: 0; left: 0; z-index: 10;
            animation: scan 2.5s linear infinite;
        }

        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }

        /* Nút lật camera góc phải trên */
        .camera-btn {
            position: absolute;
            top: 12px; right: 12px;
            width: 40px; height: 40px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            z-index: 15; border: none; cursor: pointer; color: white;
        }

        /* Thẻ kết quả màu xanh nhạt */
        .result-card {
            background: var(--result-bg);
            border: 2px solid var(--result-border);
            border-radius: 16px;
            padding: 12px 16px;
            display: flex; /* Mặc định dùng js để đổi thành flex khi nhận diện được */
            align-items: center;
            gap: 16px;
            display: none;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Avatar */
        .avatar {
            width: 50px; height: 50px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid #4caf50;
            background-color: #fff;
        }

        /* Thông tin chữ */
        .info-col { display: flex; flex-direction: column; justify-content: center; }
        .id-text { color: var(--primary); font-size: 13px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
        .name-text { color: var(--text-dark); font-size: 18px; font-weight: 700; }

        /* Trạng thái hệ thống (Hiển thị khi đang load) */
        #status-msg {
            text-align: center; font-size: 14px; font-weight: 600; color: #666;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- Trạng thái lúc load -->
        <div id="status-msg">Đang khởi tạo hệ thống...</div>

        <!-- Khung Camera -->
        <div class="scanner-container">
            <div class="scan-line"></div>
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
            
            <!-- Nút lật camera (UI) -->
            <button class="camera-btn" onclick="toggleCamera()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <polyline points="15 10 17 12 15 14"></polyline>
                    <polyline points="9 14 7 12 9 10"></polyline>
                </svg>
            </button>
        </div>

        <!-- Thẻ kết quả -->
        <div id="resultCard" class="result-card">
            <!-- Đặt ảnh mặc định, sẽ thay thế bằng ảnh từ DriveUrl nếu có -->
            <img id="res-avatar" class="avatar" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ccc'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/></svg>">
            <div class="info-col">
                <span class="id-text">MÃ ID: <span id="res-mnv">...</span></span>
                <span class="name-text" id="res-name">...</span>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const resultCard = document.getElementById('resultCard');
        const statusMsg = document.getElementById('status-msg');
        
        const API_URL = 'https://script.google.com/macros/s/AKfycbzwoSShI37Pg6P4GhIYSwpcGkN_LeO0fLldHWBvYyz96PFx_qCAfV7IE3mBxFheZXrDNQ/exec';
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        
        let faceMatcher = null;
        let isDetecting = false;
        let useFrontCamera = true;

        // Hàm chuyển đổi Link Drive thành Link ảnh trực tiếp
        function getDirectDriveUrl(url) {
            if (!url) return '';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/uc?export=view&id=${match[1]}`;
            }
            return url;
        }

        async function init() {
            try {
                if (typeof faceapi === 'undefined') throw new Error("Chưa tải được thư viện AI.");

                statusMsg.innerText = 'Đang nạp mô hình nhận diện...';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                statusMsg.innerText = 'Đang đồng bộ dữ liệu...';
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.status === "success" && result.data) {
                    const labeledDescriptors = result.data.map(person => {
                        const float32Array = new Float32Array(person.embeddings);
                        // Đóng gói mnv, tên và cả driveUrl vào label để tí nữa trích xuất ra
                        const labelData = JSON.stringify({ 
                            mnv: person.mnv, 
                            name: person.hoTen,
                            driveUrl: person.driveUrl 
                        });
                        return new faceapi.LabeledFaceDescriptors(labelData, [float32Array]);
                    });

                    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
                    statusMsg.style.display = 'none'; // Ẩn trạng thái khi load xong
                    startWebcam();
                } else {
                    statusMsg.innerText = 'Dữ liệu API trống!';
                }
            } catch (error) {
                statusMsg.innerText = 'Lỗi: ' + error.message;
            }
        }

        function startWebcam() {
            const facingMode = useFrontCamera ? 'user' : 'environment';
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: facingMode, width: { ideal: 720 }, height: { ideal: 960 } } 
            })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { statusMsg.innerText = 'Chưa cấp quyền Camera'; statusMsg.style.display = 'block'; });
        }

        function toggleCamera() {
            useFrontCamera = !useFrontCamera;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            startWebcam();
        }

        async function detectFaces() {
            if (!faceMatcher || video.paused || video.ended) {
                isDetecting = false; return;
            }

            const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptors();
                
            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            const resizedDetections = faceapi.resizeResults(detections, displaySize);
            
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            if (resizedDetections.length === 0) {
                resultCard.style.display = 'none';
            } else {
                resizedDetections.forEach(detection => {
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    const box = detection.detection.box;

                    let drawLabel = "Không xác định";
                    let boxColor = "#ff5252"; // Đỏ nếu không nhận ra

                    if (match.label !== 'unknown') {
                        boxColor = "#00bfa5"; // Xanh ngọc giống hình[span_2](start_span)[span_2](end_span)
                        try {
                            const personData = JSON.parse(match.label);
                            drawLabel = personData.name;
                            
                            // Cập nhật thẻ kết quả
                            resultCard.style.display = 'flex';
                            document.getElementById('res-mnv').innerText = personData.mnv;
                            document.getElementById('res-name').innerText = personData.name;
                            
                            // Cập nhật Avatar từ link Drive
                            if(personData.driveUrl) {
                                document.getElementById('res-avatar').src = getDirectDriveUrl(personData.driveUrl);
                            }
                        } catch (e) { console.error(e); }
                    } else {
                        resultCard.style.display = 'none';
                    }

                    // Vẽ khung định vị màu xanh ngọc với nền chữ xanh[span_3](start_span)[span_3](end_span)
                    const drawBox = new faceapi.draw.DrawBox(box, { 
                        label: drawLabel, 
                        lineWidth: 2, 
                        boxColor: boxColor,
                        drawLabelOptions: { fontSize: 14, fontColor: '#fff', backgroundColor: boxColor, padding: 4 }
                    });
                    drawBox.draw(overlay);
                });
            }

            setTimeout(() => { requestAnimationFrame(detectFaces); }, 80);
        }

        video.addEventListener('play', () => {
            overlay.width = video.clientWidth;
            overlay.height = video.clientHeight;
            
            if (!isDetecting) {
                isDetecting = true;
                detectFaces();
            }
        });

        window.addEventListener('load', init);
    </script>
</body>
</html>
