<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Face Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        :root {
            --primary: #00bfa5;
            --bg-gradient: linear-gradient(135deg, #e4c1f9 0%, #a9def9 100%);
            --card-bg: #ffffff;
            --result-bg: #eaffea;
            --result-border: #b2ebb4;
            --text-dark: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Khu vực Camera */
        .scanner-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }

        video { 
            width: 100%; height: 100%; 
            object-fit: cover; display: block; 
            transform: scaleX(-1);
            -webkit-transform: scaleX(-1);
        }

        /* KHUNG NGẮM CỐ ĐỊNH */
        .viewfinder {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 65%;
            aspect-ratio: 3/4;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            z-index: 10;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }

        .viewfinder::before, .viewfinder::after {
            content: ''; position: absolute; width: 100%; height: 100%;
            border: 4px solid var(--primary); border-radius: 16px;
            z-index: 11; box-sizing: border-box;
            clip-path: polygon(0 0, 20% 0, 20% 100%, 0 100%, 0 20%, 100% 20%, 100% 0, 80% 0, 80% 100%, 100% 100%, 100% 80%, 0 80%);
        }

        .scan-line {
            position: absolute;
            width: 100%; height: 3px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
            top: 0; left: 0; z-index: 12;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .camera-btn {
            position: absolute; top: 12px; right: 12px;
            width: 40px; height: 40px;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            z-index: 15; border: none; cursor: pointer; color: white;
        }

        /* -----------------------------------
           THẺ KẾT QUẢ - SỬA LỖI GIẬT MÀN HÌNH 
           ----------------------------------- */
        .result-wrapper {
            /* Wrapper luôn giữ một khoảng trống cố định bằng chiều cao của thẻ kết quả */
            min-height: 80px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-card {
            background: var(--result-bg);
            border: 2px solid var(--result-border);
            border-radius: 16px; padding: 12px 16px;
            display: flex; align-items: center; gap: 16px;
            width: 100%;
            /* Thay vì ẩn hoàn toàn (display:none), ta làm trong suốt để giữ khung */
            opacity: 0; 
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease-out;
        }

        /* Khi có class 'active', thẻ kết quả sẽ mờ dần lên */
        .result-card.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .avatar {
            width: 50px; height: 50px; border-radius: 12px;
            object-fit: cover; border: 2px solid #4caf50; background-color: #fff;
        }

        .info-col { display: flex; flex-direction: column; justify-content: center; }
        .id-text { color: var(--primary); font-size: 13px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
        .name-text { color: var(--text-dark); font-size: 18px; font-weight: 700; }
        #status-msg { text-align: center; font-size: 14px; font-weight: 600; color: #666; padding: 5px 0; }
    </style>
</head>
<body>

    <div class="main-card">
        <div id="status-msg">Đang khởi tạo hệ thống...</div>

        <!-- Khung Camera -->
        <div class="scanner-container">
            <video id="video" autoplay muted playsinline></video>
            
            <!-- KHUNG NGẮM CỐ ĐỊNH -->
            <div class="viewfinder">
                <div class="scan-line"></div>
            </div>
            
            <button class="camera-btn" onclick="toggleCamera()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <polyline points="15 10 17 12 15 14"></polyline>
                    <polyline points="9 14 7 12 9 10"></polyline>
                </svg>
            </button>
        </div>

        <!-- Vùng chứa Thẻ kết quả (Giữ không cho giật) -->
        <div class="result-wrapper">
            <!-- Thẻ kết quả -->
            <div id="resultCard" class="result-card">
                <!-- Avatar mặc định nếu ảnh bị lỗi sẽ fallback về ảnh này -->
                <img id="res-avatar" class="avatar" src="https://i.imgur.com/6VBx3io.png" onerror="this.src='https://i.imgur.com/6VBx3io.png'">
                <div class="info-col">
                    <span class="id-text">MÃ ID: <span id="res-mnv">...</span></span>
                    <span class="name-text" id="res-name">...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const resultCard = document.getElementById('resultCard');
        const statusMsg = document.getElementById('status-msg');
        
        const API_URL = 'https://script.google.com/macros/s/AKfycbzwoSShI37Pg6P4GhIYSwpcGkN_LeO0fLldHWBvYyz96PFx_qCAfV7IE3mBxFheZXrDNQ/exec';
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        
        let faceMatcher = null;
        let isDetecting = false;
        let useFrontCamera = true;
        let scanTimeout = null;

        // Hàm chuyển đổi Link Drive thành Link ảnh trực tiếp
        function getDirectDriveUrl(url) {
            if (!url) return 'https://i.imgur.com/6VBx3io.png';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                // Sử dụng API lấy ảnh trực tiếp của Google
                return `https://drive.google.com/uc?id=${match[1]}`;
            }
            return url;
        }

        async function init() {
            try {
                if (typeof faceapi === 'undefined') throw new Error("Chưa tải được thư viện AI.");

                statusMsg.innerText = 'Đang nạp mô hình nhận diện...';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                statusMsg.innerText = 'Đang đồng bộ dữ liệu...';
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.status === "success" && result.data) {
                    const labeledDescriptors = result.data.map(person => {
                        const float32Array = new Float32Array(person.embeddings);
                        const labelData = JSON.stringify({ mnv: person.mnv, name: person.hoTen, driveUrl: person.driveUrl });
                        return new faceapi.LabeledFaceDescriptors(labelData, [float32Array]);
                    });

                    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
                    statusMsg.style.display = 'none';
                    startWebcam();
                } else {
                    statusMsg.innerText = 'Dữ liệu API trống!';
                }
            } catch (error) {
                statusMsg.innerText = 'Lỗi: ' + error.message;
            }
        }

        function startWebcam() {
            const facingMode = useFrontCamera ? 'user' : 'environment';
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: facingMode, width: { ideal: 720 }, height: { ideal: 960 } } 
            })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { statusMsg.innerText = 'Chưa cấp quyền Camera'; statusMsg.style.display = 'block'; });
        }

        function toggleCamera() {
            useFrontCamera = !useFrontCamera;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            startWebcam();
        }

        async function detectFaces() {
            if (!faceMatcher || video.paused || video.ended) {
                isDetecting = false; return;
            }

            const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptors();

            let matchedPerson = null;

            if (detections.length > 0) {
                const detection = detections[0]; 
                const match = faceMatcher.findBestMatch(detection.descriptor);

                if (match.label !== 'unknown') {
                    try {
                        matchedPerson = JSON.parse(match.label);
                    } catch (e) { console.error(e); }
                }
            }

            if (matchedPerson) {
                // Hiển thị khung (Thêm class active thay vì đổi display)
                resultCard.classList.add('active');
                document.getElementById('res-mnv').innerText = matchedPerson.mnv;
                document.getElementById('res-name').innerText = matchedPerson.name;
                
                // Cập nhật Avatar
                if(matchedPerson.driveUrl) {
                    const newImgSrc = getDirectDriveUrl(matchedPerson.driveUrl);
                    const currentImgSrc = document.getElementById('res-avatar').src;
                    
                    // Chỉ đổi src nếu ảnh mới khác ảnh cũ (tránh tải lại ảnh liên tục làm giật trang)
                    if (currentImgSrc !== newImgSrc) {
                        document.getElementById('res-avatar').src = newImgSrc;
                    }
                }
                
                // Giữ khung kết quả hiển thị thêm 2 giây kể cả khi người dùng quay mặt đi chỗ khác
                clearTimeout(scanTimeout);
                scanTimeout = setTimeout(() => {
                    resultCard.classList.remove('active');
                }, 2000);

            } else if (!scanTimeout) {
                // Chỉ ẩn nếu không trong thời gian chờ 2 giây
                resultCard.classList.remove('active');
            }

            setTimeout(() => { requestAnimationFrame(detectFaces); }, 80);
        }

        video.addEventListener('play', () => {
            if (!isDetecting) {
                isDetecting = true;
                detectFaces();
            }
        });

        window.addEventListener('load', init);
    </script>
</body>
</html>
