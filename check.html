<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Face ID Scanner</title>
    <!-- Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Thư viện Face-api -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --success: #00ff87;
            --danger: #ff0f7b;
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: var(--bg-gradient);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 600;
            background: -webkit-linear-gradient(45deg, #4facfe, #00f2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .header p { color: #a8b2d1; font-size: 14px; margin-top: 5px; }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            width: 100%;
            max-width: 1000px;
        }

        @media (min-width: 800px) {
            .container { grid-template-columns: 1.5fr 1fr; }
        }

        /* Glass Panel Effect */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Camera Box */
        .scanner-container {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.2);
            border: 2px solid rgba(0, 242, 254, 0.3);
        }

        /* Hiệu ứng tia quét ngang */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
            top: 0;
            left: 0;
            z-index: 10;
            animation: scan 3s linear infinite;
            opacity: 0.7;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        /* Lật camera chuẩn gương */
        video, canvas {
            transform: scaleX(-1);
            -webkit-transform: scaleX(-1);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* Info Panel */
        .info-title {
            font-size: 16px;
            font-weight: 500;
            color: #a8b2d1;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        
        .status-loading { color: #f6d365; border-color: rgba(246, 211, 101, 0.3); }
        .status-success { color: var(--success); border-color: rgba(0, 255, 135, 0.3); box-shadow: 0 0 15px rgba(0,255,135,0.1); }
        .status-error { color: var(--danger); border-color: rgba(255, 15, 123, 0.3); }

        /* Kết quả thẻ định danh */
        .id-card {
            margin-top: 25px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            display: none; /* Ẩn mặc định */
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .id-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 5px; height: 100%;
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .id-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }
        
        .id-row:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
        
        .id-label { color: #a8b2d1; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .id-value { font-size: 16px; font-weight: 600; color: #fff; }
        .id-value.highlight { color: var(--success); text-shadow: 0 0 10px rgba(0, 255, 135, 0.5); font-size: 18px; }

    </style>
</head>
<body>

    <div class="header">
        <h1>AI Face Scanner</h1>
        <p>Hệ thống định danh tự động</p>
    </div>

    <div class="container">
        <!-- Khung Camera bên trái -->
        <div class="glass-panel">
            <div class="scanner-container">
                <div class="scan-line"></div>
                <video id="video" autoplay muted playsinline></video>
                <canvas id="overlay"></canvas>
            </div>
        </div>

        <!-- Bảng thông tin bên phải -->
        <div class="glass-panel">
            <div class="info-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                Trạng thái hệ thống
            </div>
            
            <div id="status" class="status-indicator status-loading">
                Đang khởi tạo lõi AI...
            </div>

            <!-- Thẻ định danh -->
            <div id="resultCard" class="id-card">
                <div class="id-row">
                    <span class="id-label">Mã nhân sự</span>
                    <span class="id-value" id="res-mnv">...</span>
                </div>
                <div class="id-row">
                    <span class="id-label">Họ & Tên</span>
                    <span class="id-value" id="res-name">...</span>
                </div>
                <div class="id-row">
                    <span class="id-label">Độ tin cậy (Match)</span>
                    <span class="id-value highlight" id="res-score">...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const statusEl = document.getElementById('status');
        const resultCard = document.getElementById('resultCard');
        
        const API_URL = 'https://script.google.com/macros/s/AKfycbzwoSShI37Pg6P4GhIYSwpcGkN_LeO0fLldHWBvYyz96PFx_qCAfV7IE3mBxFheZXrDNQ/exec';
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        
        let faceMatcher = null;
        let isDetecting = false;

        function updateStatus(message, type = 'status-loading') {
            statusEl.className = `status-indicator ${type}`;
            statusEl.innerText = message;
        }

        async function init() {
            try {
                if (typeof faceapi === 'undefined') {
                    throw new Error("Không thể tải thư viện AI.");
                }

                updateStatus('Đang nạp mô hình Neural Network...', 'status-loading');
                
                // Dùng model Tiny mượt mà
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                updateStatus('Đang đồng bộ dữ liệu API...', 'status-loading');
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.status === "success" && result.data && result.data.length > 0) {
                    const labeledDescriptors = result.data.map(person => {
                        const float32Array = new Float32Array(person.embeddings);
                        const labelData = JSON.stringify({ mnv: person.mnv, name: person.hoTen });
                        return new faceapi.LabeledFaceDescriptors(labelData, [float32Array]);
                    });

                    // Ngưỡng 0.45
                    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
                    
                    updateStatus(`Đã sẵn sàng - Đồng bộ ${result.total} nhân sự`, 'status-success');
                    startWebcam();
                } else {
                    updateStatus('Lỗi: Dữ liệu API trống', 'status-error');
                }
            } catch (error) {
                console.error(error);
                updateStatus('Lỗi hệ thống: ' + error.message, 'status-error');
            }
        }

        function startWebcam() {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 540 } } 
            })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                updateStatus('Chưa cấp quyền truy cập Camera', 'status-error');
            });
        }

        async function detectFaces() {
            if (!faceMatcher || video.paused || video.ended) {
                isDetecting = false;
                return;
            }

            const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptors();
                
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            const resizedDetections = faceapi.resizeResults(detections, displaySize);
            
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            if (resizedDetections.length === 0) {
                resultCard.style.display = 'none';
            } else {
                resizedDetections.forEach(detection => {
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    const box = detection.detection.box;

                    let drawLabel = "Khách lạ";
                    let boxColor = "#ff0f7b"; // Đỏ Neon (Khách)

                    if (match.label !== 'unknown') {
                        boxColor = "#00ff87"; // Xanh Neon (Đã nhận diện)
                        try {
                            const personData = JSON.parse(match.label);
                            drawLabel = personData.name;
                            
                            // Cập nhật UI
                            resultCard.style.display = 'block';
                            document.getElementById('res-mnv').innerText = personData.mnv;
                            document.getElementById('res-name').innerText = personData.name;
                            const confidence = Math.round((1 - match.distance) * 100);
                            document.getElementById('res-score').innerText = `${confidence}%`;
                        } catch (e) {
                            console.error(e);
                        }
                    } else {
                        resultCard.style.display = 'none';
                    }

                    // Tùy chỉnh khung vẽ cực chất
                    const drawBox = new faceapi.draw.DrawBox(box, { 
                        label: drawLabel, 
                        lineWidth: 3, 
                        boxColor: boxColor,
                        drawLabelOptions: { 
                            fontSize: 18,
                            fontColor: '#000',
                            backgroundColor: boxColor,
                            padding: 10
                        }
                    });
                    drawBox.draw(overlay);
                });
            }

            // Dùng setTimeout + requestAnimationFrame để luồng chạy êm, ko nóng máy
            setTimeout(() => {
                requestAnimationFrame(detectFaces);
            }, 50);
        }

        video.addEventListener('play', () => {
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);
            
            if (!isDetecting) {
                isDetecting = true;
                detectFaces();
            }
        });

        window.addEventListener('load', init);
    </script>
</body>
</html>
