<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Face Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --success: #00ff87;
            --danger: #ff0f7b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        /* Khóa chết kích thước trang, ẩn thanh cuộn */
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* Container phủ kín 100% màn hình */
        .scanner-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Lật camera chuẩn gương */
        video, canvas {
            transform: scaleX(-1);
            -webkit-transform: scaleX(-1);
        }

        /* Video phủ kín, tự cắt cúp phần thừa để không làm méo hình */
        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 5;
        }

        /* Tia quét ngang */
        .scan-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
            top: 0; left: 0; z-index: 10;
            animation: scan 3s linear infinite;
            opacity: 0.7;
        }

        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }

        /* Panel kết quả nổi đè lên trên Video (Góc dưới) */
        .result-panel {
            position: absolute;
            bottom: 30px; /* Cách đáy 30px */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            z-index: 20;
            
            background: rgba(15, 32, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            
            display: none; 
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .result-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 6px; height: 100%;
            background: var(--success);
            box-shadow: 0 0 15px var(--success);
        }

        @keyframes popUp {
            from { opacity: 0; transform: translate(-50%, 40px) scale(0.9); }
            to { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }

        .id-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px;
        }
        
        .id-row:last-child { margin-bottom: 0; border-bottom: none; padding-bottom: 0; }
        .id-label { color: #a8b2d1; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
        .id-value { font-size: 16px; font-weight: 600; color: #fff; }
        .id-value.highlight { color: var(--success); text-shadow: 0 0 10px rgba(0, 255, 135, 0.4); font-size: 18px; }

    </style>
</head>
<body>

    <div class="scanner-container">
        <!-- Khung Video Toàn màn hình -->
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
        <div class="scan-line"></div>

        <!-- Thẻ kết quả nổi (Overlay) -->
        <div id="resultCard" class="result-panel">
            <div class="id-row">
                <span class="id-label">Mã nhân sự</span>
                <span class="id-value" id="res-mnv">...</span>
            </div>
            <div class="id-row">
                <span class="id-label">Họ & Tên</span>
                <span class="id-value" id="res-name">...</span>
            </div>
            <div class="id-row">
                <span class="id-label">Mức độ khớp</span>
                <span class="id-value highlight" id="res-score">...</span>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const resultCard = document.getElementById('resultCard');
        
        const API_URL = 'https://script.google.com/macros/s/AKfycbzwoSShI37Pg6P4GhIYSwpcGkN_LeO0fLldHWBvYyz96PFx_qCAfV7IE3mBxFheZXrDNQ/exec';
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        
        let faceMatcher = null;
        let isDetecting = false;

        function logStatus(message) {
            console.log(`[Hệ thống]: ${message}`);
        }

        async function init() {
            try {
                if (typeof faceapi === 'undefined') throw new Error("Không thể tải thư viện AI.");

                logStatus('Đang nạp mô hình...');
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                logStatus('Đang tải dữ liệu API...');
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.status === "success" && result.data && result.data.length > 0) {
                    const labeledDescriptors = result.data.map(person => {
                        const float32Array = new Float32Array(person.embeddings);
                        const labelData = JSON.stringify({ mnv: person.mnv, name: person.hoTen });
                        return new faceapi.LabeledFaceDescriptors(labelData, [float32Array]);
                    });

                    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
                    logStatus(`Đã sẵn sàng - Đồng bộ ${result.total} nhân sự`);
                    startWebcam();
                } else {
                    logStatus('Lỗi: Dữ liệu API trống');
                }
            } catch (error) {
                console.error('Lỗi hệ thống: ', error);
            }
        }

        function startWebcam() {
            // Lấy độ phân giải cao nhất màn hình có thể hỗ trợ
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user', width: { ideal: 1080 }, height: { ideal: 1920 } } 
            })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.error('Chưa cấp quyền truy cập Camera', err); });
        }

        async function detectFaces() {
            if (!faceMatcher || video.paused || video.ended) {
                isDetecting = false;
                return;
            }

            const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptors();
                
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            const resizedDetections = faceapi.resizeResults(detections, displaySize);
            
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            if (resizedDetections.length === 0) {
                resultCard.style.display = 'none';
            } else {
                resizedDetections.forEach(detection => {
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    const box = detection.detection.box;

                    let drawLabel = "Khách lạ";
                    let boxColor = "#ff0f7b"; // Đỏ

                    if (match.label !== 'unknown') {
                        boxColor = "#00ff87"; // Xanh
                        try {
                            const personData = JSON.parse(match.label);
                            drawLabel = personData.name;
                            
                            // Hiển thị Card dữ liệu
                            resultCard.style.display = 'block';
                            document.getElementById('res-mnv').innerText = personData.mnv;
                            document.getElementById('res-name').innerText = personData.name;
                            const confidence = Math.round((1 - match.distance) * 100);
                            document.getElementById('res-score').innerText = `${confidence}%`;
                        } catch (e) {
                            console.error(e);
                        }
                    } else {
                        // Nếu là khách lạ, ẩn thẻ thông tin đi để màn hình thoáng
                        resultCard.style.display = 'none'; 
                    }

                    const drawBox = new faceapi.draw.DrawBox(box, { 
                        label: drawLabel, 
                        lineWidth: 3, 
                        boxColor: boxColor,
                        drawLabelOptions: { fontSize: 20, fontColor: '#000', backgroundColor: boxColor, padding: 10 }
                    });
                    drawBox.draw(overlay);
                });
            }

            setTimeout(() => {
                requestAnimationFrame(detectFaces);
            }, 50);
        }

        video.addEventListener('play', () => {
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);
            
            if (!isDetecting) {
                isDetecting = true;
                detectFaces();
            }
        });

        window.addEventListener('load', init);
    </script>
</body>
</html>
