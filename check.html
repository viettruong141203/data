<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Face Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        :root {
            --primary: #00bfa5;
            --bg-gradient: linear-gradient(135deg, #e4c1f9 0%, #a9def9 100%);
            --card-bg: #ffffff;
            --result-bg: #eaffea;
            --result-border: #b2ebb4;
            --text-dark: #1a1a1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Quicksand', sans-serif; }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .scanner-container {
            position: relative;
            width: 100%;
            aspect-ratio: 3/4;
            border-radius: 16px;
            overflow: hidden;
            background: #000;
        }

        video { 
            width: 100%; height: 100%; 
            object-fit: cover; display: block; 
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
        }

        .mirror {
            transform: scaleX(-1);
            -webkit-transform: scaleX(-1);
        }

        .scan-line {
            position: absolute;
            width: 100%; height: 3px;
            background: rgba(0, 191, 165, 0.8);
            box-shadow: 0 0 15px rgba(0, 191, 165, 0.8);
            top: 0; left: 0; z-index: 12;
            animation: scan 2.5s linear infinite;
        }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .camera-btn {
            position: absolute; top: 12px; right: 12px;
            width: 40px; height: 40px;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            z-index: 15; border: none; cursor: pointer; color: white;
        }

        .result-wrapper {
            min-height: 80px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .result-card {
            background: var(--result-bg);
            border: 2px solid var(--result-border);
            border-radius: 16px; padding: 12px 16px;
            display: flex; align-items: center; gap: 16px;
            width: 100%;
            opacity: 0; 
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s ease-out;
        }

        .result-card.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .avatar {
            width: 50px; height: 50px; border-radius: 12px;
            object-fit: cover; border: 2px solid var(--primary); background-color: #fff;
        }

        .info-col { display: flex; flex-direction: column; justify-content: center; }
        .id-text { color: var(--primary); font-size: 13px; font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
        .name-text { color: var(--text-dark); font-size: 18px; font-weight: 700; }
        #status-msg { text-align: center; font-size: 14px; font-weight: 600; color: #666; padding: 5px 0; }
    </style>
</head>
<body>

    <div class="main-card">
        <div id="status-msg">Đang khởi tạo hệ thống...</div>

        <div class="scanner-container">
            <video id="video" autoplay muted playsinline></video>
            <canvas id="overlay"></canvas>
            <div class="scan-line"></div>
            
            <button class="camera-btn" onclick="toggleCamera()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <polyline points="15 10 17 12 15 14"></polyline>
                    <polyline points="9 14 7 12 9 10"></polyline>
                </svg>
            </button>
        </div>

        <div class="result-wrapper">
            <div id="resultCard" class="result-card">
                <img id="res-avatar" class="avatar" src="https://i.imgur.com/6VBx3io.png" onerror="this.src='https://i.imgur.com/6VBx3io.png'">
                <div class="info-col">
                    <span class="id-text">MÃ ID: <span id="res-mnv">...</span></span>
                    <span class="name-text" id="res-name">...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const resultCard = document.getElementById('resultCard');
        const statusMsg = document.getElementById('status-msg');
        
        const GET_DATA_URL = 'https://script.google.com/macros/s/AKfycbzwoSShI37Pg6P4GhIYSwpcGkN_LeO0fLldHWBvYyz96PFx_qCAfV7IE3mBxFheZXrDNQ/exec';
        const POST_DATA_URL = 'https://script.google.com/macros/s/AKfycbyOz_0L9XUbwzt50UNG7M9ftZKmeYx_NdTFjep5hc25OeTfb1YlhiwvkCPUV4fHGMeMqA/exec';
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        
        let faceMatcher = null;
        let isDetecting = false;
        let useFrontCamera = true;
        let scanTimeout = null;
        let lastSentLog = {}; 

        function getDirectDriveUrl(url) {
            if (!url) return 'https://i.imgur.com/6VBx3io.png';
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://drive.google.com/uc?export=view&id=${match[1]}`;
            }
            return url;
        }

        function getCurrentFormattedTime() {
            const d = new Date();
            const timeStr = `${("0"+d.getHours()).slice(-2)}:${("0"+d.getMinutes()).slice(-2)}:${("0"+d.getSeconds()).slice(-2)}`;
            const dateStr = `${("0"+d.getDate()).slice(-2)}/${("0"+(d.getMonth()+1)).slice(-2)}/${d.getFullYear()}`;
            return `${timeStr} ${dateStr}`;
        }

        function sendToGoogleSheet(person) {
            const now = Date.now();
            if (lastSentLog[person.mnv] && (now - lastSentLog[person.mnv]) < 15000) {
                return; 
            }
            lastSentLog[person.mnv] = now;

            const payload = {
                action: "add",
                sheet: "Face ID",
                Cot_C: getCurrentFormattedTime(),
                Cot_D: person.mnv,
                Cot_E: person.name
            };

            fetch(POST_DATA_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).catch(() => {});
        }

        async function init() {
            try {
                if (typeof faceapi === 'undefined') throw new Error("Chưa tải được thư viện AI.");

                statusMsg.innerText = 'Đang nạp mô hình nhận diện...';
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                statusMsg.innerText = 'Đang đồng bộ dữ liệu...';
                const response = await fetch(GET_DATA_URL);
                const result = await response.json();

                if (result.status === "success" && result.data) {
                    const labeledDescriptors = result.data.map(person => {
                        const float32Array = new Float32Array(person.embeddings);
                        const labelData = JSON.stringify({ mnv: person.mnv, name: person.hoTen, driveUrl: person.driveUrl });
                        return new faceapi.LabeledFaceDescriptors(labelData, [float32Array]);
                    });

                    // BƯỚC 1: HẠ NGƯỠNG SAI SỐ (Khoảng cách Euclidean) XUỐNG 0.38
                    // Hệ thống sẽ khắt khe hơn khi đối chiếu khuôn mặt, giảm triệt để tỷ lệ nhận diện nhầm
                    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.38); 
                    
                    statusMsg.style.display = 'none';
                    startWebcam();
                } else {
                    statusMsg.innerText = 'Dữ liệu API trống!';
                }
            } catch (error) {
                statusMsg.innerText = 'Lỗi: ' + error.message;
            }
        }

        function startWebcam() {
            const facingMode = useFrontCamera ? 'user' : 'environment';
            
            if (useFrontCamera) {
                video.classList.add('mirror');
                overlay.classList.add('mirror');
            } else {
                video.classList.remove('mirror');
                overlay.classList.remove('mirror');
            }

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: facingMode, width: { ideal: 720 }, height: { ideal: 960 } } 
            })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { statusMsg.innerText = 'Chưa cấp quyền Camera'; statusMsg.style.display = 'block'; });
        }

        function toggleCamera() {
            useFrontCamera = !useFrontCamera;
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            startWebcam();
        }

        async function detectFaces() {
            if (!faceMatcher || video.paused || video.ended) {
                isDetecting = false; return;
            }

            // BƯỚC 2: TĂNG NGƯỠNG ĐỘ TIN CẬY KHUÔN MẶT (Score Threshold) LÊN 0.65
            // Máy sẽ chỉ quét những khuôn mặt đủ sáng, rõ ràng và nhìn trực diện
            const detectorOptions = new faceapi.TinyFaceDetectorOptions({ scoreThreshold: 0.65 });
            
            const detections = await faceapi.detectAllFaces(video, detectorOptions)
                .withFaceLandmarks()
                .withFaceDescriptors();

            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            const resizedDetections = faceapi.resizeResults(detections, displaySize);
            
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            let matchedPerson = null;

            if (resizedDetections.length > 0) {
                resizedDetections.forEach(detection => {
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    const box = detection.detection.box;

                    if (match.label !== 'unknown') {
                        try {
                            const personData = JSON.parse(match.label);
                            matchedPerson = personData; 
                            
                            const drawBox = new faceapi.draw.DrawBox(box, { 
                                label: personData.name, 
                                lineWidth: 2, 
                                boxColor: "#00bfa5",
                                drawLabelOptions: { fontSize: 14, fontColor: '#fff', backgroundColor: "#00bfa5", padding: 4 }
                            });
                            drawBox.draw(overlay);

                            sendToGoogleSheet(personData);

                        } catch (e) { console.error(e); }
                    }
                });
            }

            if (matchedPerson) {
                resultCard.classList.add('active');
                document.getElementById('res-mnv').innerText = matchedPerson.mnv;
                document.getElementById('res-name').innerText = matchedPerson.name;
                
                if(matchedPerson.driveUrl) {
                    const newImgSrc = getDirectDriveUrl(matchedPerson.driveUrl);
                    const currentImgSrc = document.getElementById('res-avatar').src;
                    if (currentImgSrc !== newImgSrc) {
                        document.getElementById('res-avatar').src = newImgSrc;
                    }
                }
                
                clearTimeout(scanTimeout);
                scanTimeout = setTimeout(() => {
                    resultCard.classList.remove('active');
                }, 2000);

            } else if (!scanTimeout) {
                resultCard.classList.remove('active');
            }

            setTimeout(() => { requestAnimationFrame(detectFaces); }, 80);
        }

        video.addEventListener('play', () => {
            overlay.width = video.clientWidth;
            overlay.height = video.clientHeight;
            
            if (!isDetecting) {
                isDetecting = true;
                detectFaces();
            }
        });

        window.addEventListener('load', init);
    </script>
</body>
</html>
