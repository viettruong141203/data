<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Face Scanner - GitHub Interface</title>
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.min.js"></script>
    <style>
        /* GitHub Dark Theme Variables */
        :root {
            --gh-bg: #0d1117;
            --gh-surface: #161b22;
            --gh-border: #30363d;
            --gh-text: #c9d1d9;
            --gh-heading: #ffffff;
            --gh-muted: #8b949e;
            --gh-blue: #58a6ff;
            --gh-green: #238636;
            --gh-danger: #da3633;
            --gh-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 20px;
            background-color: var(--gh-bg);
            color: var(--gh-text);
            font-family: var(--gh-font);
            display: flex; justify-content: center;
        }

        .layout-container {
            width: 100%; max-width: 1012px;
            display: flex; flex-direction: column; gap: 20px;
        }

        .header {
            border-bottom: 1px solid var(--gh-border);
            padding-bottom: 16px;
        }
        .header h1 {
            margin: 0; font-size: 20px; color: var(--gh-blue); font-weight: 600;
        }
        .header h1 span { color: var(--gh-text); font-weight: 400; }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px;
            align-items: start;
        }
        @media (min-width: 768px) {
            .content-grid { grid-template-columns: 2fr 1fr; }
        }

        .box {
            background: var(--gh-surface);
            border: 1px solid var(--gh-border);
            border-radius: 6px;
            overflow: hidden;
        }
        .box-header {
            padding: 12px 16px;
            background-color: var(--gh-surface);
            border-bottom: 1px solid var(--gh-border);
            font-size: 14px; font-weight: 600; color: var(--gh-text);
        }
        
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            overflow: hidden;
        }
        
        /* QUAN TRỌNG: Lật camera như gương (Mirror) để thao tác tự nhiên hơn */
        video, canvas {
            transform: scaleX(-1);
            -webkit-transform: scaleX(-1);
        }

        video {
            width: 100%; height: auto;
            max-height: 70vh;
            display: block; object-fit: cover;
        }
        
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .info-panel { display: flex; flex-direction: column; gap: 16px; }
        
        .status-badge {
            display: inline-block; padding: 5px 12px;
            border-radius: 2em; font-size: 12px; font-weight: 600;
            border: 1px solid var(--gh-border);
        }
        .status-loading { border-color: #d29922; color: #e3b341; }
        .status-success { border-color: var(--gh-green); color: #3fb950; }
        .status-error { border-color: var(--gh-danger); color: #ff7b72; }

        .result-card {
            padding: 16px; border: 1px solid var(--gh-border);
            border-radius: 6px; background-color: var(--gh-surface);
            display: none;
        }
        .result-card h3 { margin: 0 0 12px 0; font-size: 14px; color: var(--gh-muted); }
        .result-row {
            display: flex; justify-content: space-between;
            padding: 8px 0; border-bottom: 1px solid var(--gh-border);
            font-size: 14px;
        }
        .result-row:last-child { border-bottom: none; }
        .result-row span.label { color: var(--gh-muted); }
        .result-row span.value { color: var(--gh-heading); font-weight: 600; }
    </style>
</head>
<body>

    <div class="layout-container">
        <div class="header">
            <h1>dinhtruong <span>/</span> face-scanner</h1>
        </div>

        <div class="content-grid">
            <div class="box">
                <div class="box-header">Live Camera Feed</div>
                <div class="video-wrapper">
                    <video id="video" autoplay muted playsinline></video>
                    <canvas id="overlay"></canvas>
                </div>
            </div>

            <div class="info-panel">
                <div class="box">
                    <div class="box-header">System Status</div>
                    <div style="padding: 16px;">
                        <span id="status" class="status-badge status-loading">Đang chờ khởi động...</span>
                    </div>
                </div>

                <div id="resultCard" class="result-card">
                    <h3>Nhân sự định danh</h3>
                    <div class="result-row">
                        <span class="label">Mã NV:</span>
                        <span class="value" id="res-mnv">...</span>
                    </div>
                    <div class="result-row">
                        <span class="label">Họ Tên:</span>
                        <span class="value" id="res-name">...</span>
                    </div>
                    <div class="result-row">
                        <span class="label">Độ tin cậy:</span>
                        <span class="value" id="res-score" style="color: #3fb950;">...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const statusEl = document.getElementById('status');
        const resultCard = document.getElementById('resultCard');
        
        const API_URL = 'https://script.google.com/macros/s/AKfycbzwoSShI37Pg6P4GhIYSwpcGkN_LeO0fLldHWBvYyz96PFx_qCAfV7IE3mBxFheZXrDNQ/exec';
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        
        let faceMatcher = null;
        let isDetecting = false; // Cờ kiểm soát vòng lặp, chống giật

        function updateStatus(message, type = 'status-loading') {
            statusEl.className = `status-badge ${type}`;
            statusEl.innerText = message;
        }

        async function init() {
            try {
                if (typeof faceapi === 'undefined') {
                    throw new Error("Thư viện nhận diện chưa được tải.");
                }

                updateStatus('Đang tải AI siêu nhẹ (Fast Model)...', 'status-loading');
                
                // TỐI ƯU 1: Đổi sang tinyFaceDetector (nhẹ hơn, mượt hơn gấp nhiều lần)
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);

                updateStatus('Đang tải dữ liệu API...', 'status-loading');
                const response = await fetch(API_URL);
                const result = await response.json();

                if (result.status === "success" && result.data && result.data.length > 0) {
                    const labeledDescriptors = result.data.map(person => {
                        const float32Array = new Float32Array(person.embeddings);
                        const labelData = JSON.stringify({ mnv: person.mnv, name: person.hoTen });
                        return new faceapi.LabeledFaceDescriptors(labelData, [float32Array]);
                    });

                    // Ngưỡng 0.45.
                    faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.45);
                    
                    updateStatus(`Sẵn sàng (${result.total} nhân sự)`, 'status-success');
                    startWebcam();
                } else {
                    updateStatus('API không có dữ liệu', 'status-error');
                }
            } catch (error) {
                console.error(error);
                updateStatus('Lỗi: ' + error.message, 'status-error');
            }
        }

        function startWebcam() {
            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: 'user', 
                    width: { ideal: 640 }, // Cố định độ phân giải vừa đủ để tránh giật
                    height: { ideal: 480 } 
                } 
            })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                updateStatus('Bị từ chối quyền Camera', 'status-error');
            });
        }

        // TỐI ƯU 2: Thay setInterval bằng hàm đệ quy bất đồng bộ (chống kẹt frame)
        async function detectFaces() {
            if (!faceMatcher || video.paused || video.ended) {
                isDetecting = false;
                return;
            }

            // Gọi model Tiny thay vì chuẩn để tăng tốc FPS
            const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions())
                .withFaceLandmarks()
                .withFaceDescriptors();
                
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            const resizedDetections = faceapi.resizeResults(detections, displaySize);
            
            const ctx = overlay.getContext('2d');
            ctx.clearRect(0, 0, overlay.width, overlay.height);

            if (resizedDetections.length === 0) {
                resultCard.style.display = 'none';
            } else {
                resizedDetections.forEach(detection => {
                    const match = faceMatcher.findBestMatch(detection.descriptor);
                    const box = detection.detection.box;

                    let drawLabel = "Unknown";
                    let boxColor = "#da3633";

                    if (match.label !== 'unknown') {
                        boxColor = "#3fb950";
                        try {
                            const personData = JSON.parse(match.label);
                            drawLabel = personData.name;
                            
                            resultCard.style.display = 'block';
                            document.getElementById('res-mnv').innerText = personData.mnv;
                            document.getElementById('res-name').innerText = personData.name;
                            const confidence = Math.round((1 - match.distance) * 100);
                            document.getElementById('res-score').innerText = `${confidence}%`;
                        } catch (e) {
                            console.error(e);
                        }
                    } else {
                        resultCard.style.display = 'none';
                    }

                    const drawBox = new faceapi.draw.DrawBox(box, { 
                        label: drawLabel, 
                        lineWidth: 2, 
                        boxColor: boxColor,
                        drawLabelOptions: { 
                            fontSize: 18,
                            fontColor: '#ffffff',
                            backgroundColor: boxColor,
                            padding: 8
                        }
                    });
                    drawBox.draw(overlay);
                });
            }

            // Nghỉ 50ms rồi quét tiếp khung hình tiếp theo (giúp máy ko bị nóng/lag)
            setTimeout(() => {
                requestAnimationFrame(detectFaces);
            }, 50);
        }

        video.addEventListener('play', () => {
            const displaySize = { width: video.videoWidth, height: video.videoHeight };
            faceapi.matchDimensions(overlay, displaySize);
            
            if (!isDetecting) {
                isDetecting = true;
                detectFaces(); // Khởi động vòng lặp an toàn
            }
        });

        window.addEventListener('load', () => {
            init();
        });
    </script>
</body>
</html>
