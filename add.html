<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Face ID - Đăng Ký Nhân Sự</title>
  
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body, html { width: 100%; height: 100%; background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); display: flex; justify-content: center; align-items: center; padding: 15px; }
    
    .app-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); padding: 24px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; border: 1px solid rgba(255,255,255,0.5); }
    
    .header h2 { font-weight: 800; color: #1E293B; margin-bottom: 5px; }
    .status { font-size: 0.9rem; color: #64748B; margin-bottom: 20px; font-weight: 600; }

    /* Khung chứa Camera & Ảnh xem trước */
    .view-container { position: relative; width: 100%; aspect-ratio: 1; border-radius: 20px; overflow: hidden; margin-bottom: 20px; background: #0F172A; border: 4px solid #6366F1; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2); }
    #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }

    /* Form nhập liệu */
    .input-group { text-align: left; margin-bottom: 15px; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 5px; }
    .input-group input { width: 100%; padding: 14px; border: 2px solid #E2E8F0; border-radius: 12px; outline: none; font-size: 1rem; transition: 0.3s; }
    .input-group input:focus { border-color: #6366F1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }

    /* Nút bấm */
    .btn { width: 100%; padding: 12px 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    
    .action-buttons { display: flex; gap: 10px; margin-bottom: 10px; }
    .btn-capture { background: #6366F1; color: white; flex: 2; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
    .btn-capture:hover { background: #4F46E5; transform: translateY(-2px); }
    .btn-capture:disabled { background: #94A3B8; cursor: not-allowed; box-shadow: none; transform: none; }
    
    .btn-upload { background: #F8FAFC; color: #475569; flex: 1; border: 2px solid #E2E8F0; }
    .btn-upload:hover { background: #E2E8F0; }

    .confirm-actions { display: none; gap: 10px; }
    .btn-retake { background: #F1F5F9; color: #475569; flex: 1; border: 2px solid #E2E8F0; }
    .btn-retake:hover { background: #E2E8F0; }
    .btn-save { background: #10B981; color: white; flex: 2; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .btn-save:hover { background: #059669; transform: translateY(-2px); }

    .back-link { display: block; margin-top: 20px; font-size: 0.9rem; font-weight: 700; color: #6366F1; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h2>📸 Đăng Ký Face ID</h2>
      <p id="status" class="status">Đang tải AI...</p>
    </div>

    <div class="view-container">
      <video id="video" autoplay muted playsinline></video>
      <img id="preview-img" alt="Ảnh xem trước">
    </div>

    <div class="input-group">
      <label>HỌ VÀ TÊN NHÂN VIÊN</label>
      <input type="text" id="empName" placeholder="Nhập họ và tên...">
    </div>

    <!-- Nút Hành Động Ban Đầu (Chụp hoặc Tải Ảnh) -->
    <div id="action-buttons" class="action-buttons">
      <button id="btnCapture" class="btn btn-capture" onclick="captureAndAnalyze()" disabled>📸 Chụp Ảnh</button>
      <button class="btn btn-upload" onclick="document.getElementById('imageUpload').click()">📁 Tải lên</button>
    </div>
    
    <!-- Input ẩn để tải file -->
    <input type="file" id="imageUpload" accept="image/*" style="display: none;">

    <!-- Nút Xác Nhận (Hiện ra sau khi quét thành công) -->
    <div id="confirm-actions" class="confirm-actions">
      <button class="btn btn-retake" onclick="retakePhoto()">🔄 Hủy bỏ</button>
      <button id="btnSave" class="btn btn-save" onclick="saveData()">✅ Lưu Thông Tin</button>
    </div>

    <a href="index.html" class="back-link">⬅ Quay lại màn hình Check-in</a>
  </div>

  <script>
    // ⚠️ CHÚ Ý: COPY LINK WEB APP CỦA BẠN DÁN VÀO ĐÂY
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLFwJo3omYl1N7nyqCD5Lq7GJzGc4dCWrpUYWg7IgGiu6e-Budpn4aGrySBEvvPcCI/exec"; 
    
    let capturedDescriptor = null;
    let capturedImageBase64 = null;
    let currentStream = null;

    const video = document.getElementById('video');
    const previewImg = document.getElementById('preview-img');
    const statusTxt = document.getElementById('status');
    
    const btnCapture = document.getElementById('btnCapture');
    const actionButtons = document.getElementById('action-buttons');
    const confirmActions = document.getElementById('confirm-actions');
    const btnSave = document.getElementById('btnSave');
    const inputName = document.getElementById('empName');
    const imageUpload = document.getElementById('imageUpload');

    // 1. Khởi tạo AI & Camera
    async function init() {
      const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
      try {
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
        await faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL);
        startCamera();
      } catch(e) {
        statusTxt.innerText = "Lỗi mạng: Không tải được AI!";
        statusTxt.style.color = "#EF4444";
      }
    }

    async function startCamera() {
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({ video: { width: {ideal: 640}, height: {ideal: 640}, facingMode: "user" } });
        video.srcObject = currentStream;
        video.onloadedmetadata = () => {
          video.play();
          btnCapture.disabled = false;
          statusTxt.innerText = "Sẵn sàng! Hãy đưa mặt vào khung hình.";
          statusTxt.style.color = "#10B981";
        };
      } catch(err) {
        statusTxt.innerText = "Vui lòng cấp quyền Camera!";
        statusTxt.style.color = "#EF4444";
      }
    }

    // Xử lý chung khi quét thành công (Dùng cho cả Chụp và Tải ảnh)
    function onDetectSuccess(canvas, descriptor) {
      capturedDescriptor = Array.from(descriptor);
      capturedImageBase64 = canvas.toDataURL('image/jpeg', 0.85);

      video.style.display = 'none';
      previewImg.src = capturedImageBase64;
      previewImg.style.display = 'block';

      actionButtons.style.display = 'none';
      confirmActions.style.display = 'flex';
      
      statusTxt.innerText = "✅ Đạt yêu cầu! Xác nhận để lưu.";
      statusTxt.style.color = "#10B981";
    }

    // 2. Chụp từ Camera trực tiếp
    async function captureAndAnalyze() {
      if (!inputName.value.trim()) return alert("Vui lòng nhập Họ và Tên trước!");

      btnCapture.disabled = true;
      statusTxt.innerText = "⏳ Đang phân tích khuôn mặt...";
      statusTxt.style.color = "#F59E0B";

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; 
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0); 
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
      const detection = await faceapi.detectSingleFace(canvas, options).withFaceLandmarks().withFaceDescriptor();

      if (!detection) {
        alert("❌ KHÔNG ĐẠT: Không tìm thấy khuôn mặt đầy đủ. Vui lòng thử lại!");
        retakePhoto();
        return;
      }

      onDetectSuccess(canvas, detection.descriptor);
    }

    // 3. Đăng ký bằng Tải ảnh lên
    imageUpload.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!inputName.value.trim()) {
        alert("Vui lòng nhập Họ và Tên trước khi tải ảnh!");
        e.target.value = '';
        return;
      }

      statusTxt.innerText = "⏳ Đang phân tích ảnh tải lên...";
      statusTxt.style.color = "#F59E0B";
      btnCapture.disabled = true;

      try {
        const img = await faceapi.bufferToImage(file);
        
        const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });
        const detection = await faceapi.detectSingleFace(img, options).withFaceLandmarks().withFaceDescriptor();

        if (!detection) {
          alert("❌ KHÔNG ĐẠT: Không nhận diện được khuôn mặt trong ảnh. Vui lòng chọn ảnh rõ nét, nhìn thẳng!");
          retakePhoto();
        } else {
          // Vẽ ảnh ra canvas để chuyển base64 lưu Drive
          const canvas = document.createElement('canvas');
          canvas.width = img.width; 
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, img.width, img.height);
          
          onDetectSuccess(canvas, detection.descriptor);
        }
      } catch (err) {
        alert("Lỗi đọc ảnh!");
        retakePhoto();
      }
      e.target.value = ''; // Reset input
    });

    // 4. Nút "Hủy Bỏ" / "Chụp Lại"
    function retakePhoto() {
      capturedDescriptor = null;
      capturedImageBase64 = null;
      
      previewImg.style.display = 'none';
      video.style.display = 'block';
      
      confirmActions.style.display = 'none';
      actionButtons.style.display = 'flex';
      btnCapture.disabled = false;

      statusTxt.innerText = "Sẵn sàng! Hãy đưa mặt vào khung hình.";
      statusTxt.style.color = "#10B981";
    }

    // 5. Gửi Dữ Liệu
    async function saveData() {
      btnSave.disabled = true;
      btnSave.innerText = "⏳ Đang xử lý...";
      statusTxt.innerText = "Đang lưu lên hệ thống...";

      const now = new Date();
      const timeWeb = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')} ${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;

      const payload = {
        name: inputName.value.trim(),
        faceData: JSON.stringify(capturedDescriptor),
        time: timeWeb,
        imageBase64: capturedImageBase64
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const res = await response.json();
        
        if (res.status === "success") {
          alert("🎉 " + res.message);
          inputName.value = "";
          retakePhoto();
        } else {
          alert("Lỗi server: " + res.message);
          btnSave.disabled = false;
          btnSave.innerText = "✅ Lưu Thông Tin";
        }
      } catch(e) {
        alert("Lỗi kết nối mạng!");
        btnSave.disabled = false;
        btnSave.innerText = "✅ Lưu Thông Tin";
      }
    }

    window.onload = init;
  </script>
</body>
</html>
