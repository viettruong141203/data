<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Ký Khuôn Mặt</title>
  
  <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #F1F5F9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background: #fff; padding: 24px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    .camera-wrapper { position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; margin: 0 auto 20px; border: 4px solid #6366F1; }
    #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #CBD5E1; border-radius: 10px; outline: none; font-size: 1rem; }
    .btn { width: 100%; padding: 14px; background: #6366F1; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    .btn:disabled { background: #94A3B8; cursor: not-allowed; }
    .status { margin-bottom: 15px; font-size: 0.9rem; color: #64748B; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📸 Thêm Nhân Sự</h2>
    <p class="status" id="status">Đang tải AI...</p>
    
    <div class="camera-wrapper">
      <video id="video" autoplay muted playsinline></video>
    </div>

    <!-- ID đã tự sinh nên chỉ cần nhập Tên -->
    <p style="font-size: 0.8rem; color: #10B981; margin-bottom: 10px; font-weight: bold;">*Mã ID sẽ được cấp tự động từ 500666xx</p>
    <input type="text" id="empName" placeholder="Nhập Họ và Tên...">
    
    <button id="btnRegister" class="btn" onclick="register()" disabled>Chụp & Đăng Ký Dữ Liệu</button>
    <a href="index.html" style="display: block; margin-top: 15px; color: #6366F1; text-decoration: none; font-weight: bold;">⬅ Quay lại Check-in</a>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzLFwJo3omYl1N7nyqCD5Lq7GJzGc4dCWrpUYWg7IgGiu6e-Budpn4aGrySBEvvPcCI/exec"; // THAY LINK Ở ĐÂY
    const video = document.getElementById('video');
    const btn = document.getElementById('btnRegister');
    const statusTxt = document.getElementById('status');

    async function init() {
      await faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
      await faceapi.nets.faceLandmark68Net.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
      await faceapi.nets.faceRecognitionNet.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      video.srcObject = stream;
      video.onloadedmetadata = () => btn.disabled = false;
      statusTxt.innerText = "Sẵn sàng đăng ký!";
    }

    async function register() {
      const name = document.getElementById("empName").value.trim();
      if (!name) return alert("Vui lòng nhập Tên!");

      btn.disabled = true;
      statusTxt.innerText = "Đang phân tích khuôn mặt...";

      const options = new faceapi.TinyFaceDetectorOptions();
      const detection = await faceapi.detectSingleFace(video, options).withFaceLandmarks().withFaceDescriptor();

      if (!detection) {
        alert("Không nhận diện được khuôn mặt! Đảm bảo đủ sáng.");
        statusTxt.innerText = "Sẵn sàng đăng ký!";
        btn.disabled = false;
        return;
      }

      statusTxt.innerText = "Đang chụp ảnh & gửi lên máy chủ...";

      // Chụp ảnh base64 từ video
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.translate(canvas.width, 0); ctx.scale(-1, 1); // Lật gương ảnh chụp cho xuôi
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageBase64 = canvas.toDataURL('image/jpeg', 0.8);

      // Lấy thời gian hiện tại từ Web
      const timeWeb = new Date().toLocaleString('vi-VN');

      const payload = {
        name: name,
        faceData: JSON.stringify(Array.from(detection.descriptor)),
        time: timeWeb,
        imageBase64: imageBase64
      };

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const res = await response.json();
        
        if(res.status === "success") {
          alert("🎉 " + res.message); // In ra Mã ID mới
          document.getElementById("empName").value = "";
        } else {
          alert("Lỗi: " + res.message);
        }
      } catch(e) {
        alert("Lỗi kết nối mạng!");
      }
      
      statusTxt.innerText = "Sẵn sàng đăng ký!";
      btn.disabled = false;
    }

    window.onload = init;
  </script>
</body>
</html>
